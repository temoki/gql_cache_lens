name: gql_cache_lens
description: "A Flutter DevTools Extension for inspecting GraphQL cache in your Flutter applications."
repository: "https://github.com/temoki/gql_cache_lens"

version: 1.0.0

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.32.0'

dependencies:
  devtools_extensions: ^0.4.0
  flutter:
    sdk: flutter
  google_fonts: ^6.0.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  pedantic_mono: any

flutter:
  uses-material-design: true
