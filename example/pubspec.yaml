name: github_issue_app
description: "GitHub issue viewer app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.32.0'

dependencies:
  ferry: ^0.16.1+2
  ferry_flutter: ^0.9.1+1
  flutter:
    sdk: flutter
  gql: ^1.0.1
  gql_http_link: ^1.2.0
  graphql: ^5.2.4
  graphql_flutter: ^5.3.0
  intl: ^0.20.3

dev_dependencies:
  build_runner: ^2.5.4
  ferry_generator: ^0.12.0+5
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  gql_cache_lens:
    path: ..
  graphql_codegen: ^2.0.0
  pedantic_mono: any

flutter:
  uses-material-design: true
